phase: B
total_tasks: 105000
seed: 42

tkc_path: /opt/toke-corpus/bin/tkc
corpus_dir: /opt/toke-corpus/corpus/phase_b
metrics_dir: /opt/toke-corpus/metrics
log_dir: /opt/toke-corpus/logs

prompts_dir: prompts/

# Pre-generated V2 curriculum
curriculum_file: /opt/toke-corpus/data/task_specs_v2.jsonl

trial:
  tasks: 200
  min_compile_rate: 0.40

providers:
  anthropic:
    model: claude-haiku-4-5-20251001
    tier: 2
    cost_input: 0.80
    cost_output: 4.00
    batch: true
  openai:
    model: gpt-4.1-mini
    tier: 1
    cost_input: 0.40
    cost_output: 1.60
    batch: true
  deepseek:
    model: deepseek-chat
    tier: 1
    cost_input: 0.27
    cost_output: 1.10

pool:
  tier2_minimum_pct: 0.40
  category_overrides:
    A-ERR: 0.60
    A-SRT: 0.50
    D-CRY: 0.60
    D-NET: 0.50

validation:
  timeout_seconds: 10
  max_correction_attempts: 3

dedup:
  threshold: 0.95

holdout:
  file: /opt/toke-corpus/data/holdout_task_ids.txt

cost_limit: 100.00
